# Publishes the operator UI as a static site (site mode: it connects back to a LOCAL vpi-serve).
# Needs GitHub Pages enabled for the repo. The operator stays on the lab machine.
name: pages
on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 23 }
      - run: npm ci
      - run: npm test
      - run: npm run build
        env: { VITE_SITE_MODE: "1", VITE_BASE: "/vention-printer-interface/" }
      - uses: actions/upload-pages-artifact@v3
        with: { path: frontend/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/deploy-pages@v4
